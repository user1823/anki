name: Release
run-name: "Release (run ${{ github.run_number }})"

on:
    workflow_dispatch:

permissions:
    contents: write
    actions: read

env:
    # Build profile: 1 = Release, 2 = ReleaseWithLto (see build/ninja_gen/src/build.rs)
    RELEASE: 2
    N2_OUTPUT_PROGRESS: "1"
    N2_OUTPUT_SUCCESS: "1"

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            pep440_version: ${{ steps.validate.outputs.pep440_version }}
            app_version: ${{ steps.validate.outputs.app_version }}
            tag_name: ${{ steps.validate.outputs.tag_name }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - name: Validate version and compute metadata
              id: validate
              run: |
                  pip install --break-system-packages 'packaging>=24,<26'
                  version=$(cat .version)

                  # Always append fork suffix + run number for unique, traceable artifacts
                  version="${version}+fork.build.${GITHUB_RUN_NUMBER}"

                  # The app itself uses the version without the .build.N suffix
                  app_version="${version%%.build.*}"

                  # "0.0" skips the ordering check — non-release builds only need format validation
                  python3 .github/scripts/validate_version.py "${version%%+*}" "0.0"
                  echo "Version check passed: $version"

                  {
                    echo "### Release version"
                    echo
                    echo "- Resolved version: \`$version\`"
                    echo "- App version: \`$app_version\`"
                    echo "- GitHub run number: \`$GITHUB_RUN_NUMBER\`"
                  } >> "$GITHUB_STEP_SUMMARY"

                  {
                    echo "pep440_version=$version"
                    echo "app_version=$app_version"
                    echo "tag_name=$version"
                  } >> "$GITHUB_OUTPUT"

    build-windows:
        needs: prepare
        runs-on: windows-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  ref: ${{ github.sha }}

            - name: Use app version
              shell: bash
              run: printf '%s\n' '${{ needs.prepare.outputs.app_version }}' > .version

            - name: Setup build environment
              uses: ./.github/actions/setup-anki

            - name: Build app
              run: tools\ninja installer:build

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              if: always()
              with:
                  name: logs-installer-windows
                  path: out/installer/logs/

            - name: Package installer
              # NOTE: we bypass the build system here to ensure installer:build is not run again (e.g. due to submodule clones),
              # which will remove the Anki.exe signature
              run: out\pyenv\scripts\python.exe qt\tools\build_installer.py --version ${{ needs.prepare.outputs.pep440_version }} package

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: installer-windows
                  path: out/installer/dist/

            - name: Build wheels
              run: tools\ninja wheels

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: wheels-windows
                  path: out/wheels/*.whl

    release:
        needs: [prepare, build-windows]
        if: needs.prepare.result == 'success' && needs.build-windows.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  ref: ${{ github.sha }}

            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  pattern: "{installer-windows,wheels-windows}"
                  path: dist
                  merge-multiple: true

            - name: Create release
              run: |
                  gh release create "$TAG_NAME" \
                    dist/* \
                    --title "Anki $TAG_NAME" \
                    --generate-notes \
                    --prerelease
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
